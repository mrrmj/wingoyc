<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wingo - 调试版本</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
        .debug-panel { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .status { padding: 10px; border-radius: 4px; margin: 10px 0; }
        .status.success { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
        .status.info { background: #d1ecf1; color: #0c5460; }
        .loader-screen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #667eea; 
                         color: white; display: flex; align-items: center; justify-content: center; 
                         flex-direction: column; z-index: 9999; }
        .loader-screen.hidden { opacity: 0; pointer-events: none; transition: opacity 0.5s; }
        .recent-history-list { margin-top: 20px; }
        .history-item { padding: 10px; background: #f8f9fa; margin: 5px 0; border-radius: 4px; }
        .hot-numbers-list { margin-top: 20px; }
        .hot-number-item { display: inline-block; padding: 8px; margin: 5px; background: #007bff; 
                           color: white; border-radius: 4px; }
    </style>
</head>
<body>
    <!-- 加载屏幕 -->
    <div class="loader-screen">
        <div>🎯 正在初始化应用...</div>
        <div style="margin-top: 10px;">请稍候</div>
    </div>

    <!-- 调试面板 -->
    <div class="debug-panel">
        <h1>🛠️ Wingo应用调试版</h1>
        <div id="debugStatus" class="status info">正在初始化...</div>
        <div id="debugLog"></div>
    </div>

    <!-- 简化的首页内容 -->
    <div class="debug-panel">
        <h2>📊 统计数据</h2>
        <div>大号概率: <span id="bigPercent">-</span></div>
        <div>小号概率: <span id="smallPercent">-</span></div>
        <div>单号概率: <span id="oddPercent">-</span></div>
        <div>双号概率: <span id="evenPercent">-</span></div>
    </div>

    <div class="debug-panel">
        <h2>🔥 热门号码</h2>
        <div class="hot-numbers-list" id="hotNumbersList">暂无数据</div>
    </div>

    <div class="debug-panel">
        <h2>📈 最近开奖</h2>
        <div class="recent-history-list" id="recentHistoryList">暂无数据</div>
    </div>

    <script>
        // 简化的调试脚本
        const debug = {
            log: (message, type = 'info') => {
                console.log(`[DEBUG] ${message}`);
                const debugLog = document.getElementById('debugLog');
                const debugStatus = document.getElementById('debugStatus');
                
                const logEntry = document.createElement('div');
                logEntry.className = `status ${type}`;
                logEntry.textContent = `${new Date().toLocaleTimeString()}: ${message}`;
                debugLog.appendChild(logEntry);
                
                debugStatus.textContent = message;
                debugStatus.className = `status ${type}`;
            },
            
            hideLoader: () => {
                const loader = document.querySelector('.loader-screen');
                if (loader) {
                    loader.classList.add('hidden');
                    setTimeout(() => loader.style.display = 'none', 500);
                }
            }
        };

        // 开始调试
        document.addEventListener('DOMContentLoaded', async () => {
            debug.log('DOM加载完成');
            
            try {
                debug.log('开始测试API服务...');
                
                // 测试API请求
                const apiUrl = 'https://draw.ar-lottery01.com/MotoRace/MotoRace_1M/GetHistoryIssuePage.json?ts=' + Date.now();
                
                debug.log('正在请求API数据...');
                const response = await fetch(apiUrl, { 
                    method: 'GET',
                    mode: 'cors'
                });
                
                if (response.ok) {
                    const data = await response.json();
                    debug.log(`API请求成功，获取到 ${data?.data?.length || 0} 条记录`, 'success');
                    
                    // 处理数据
                    if (data?.data?.length > 0) {
                        const processedData = data.data.slice(0, 10).map((item, index) => {
                            const number = item.number || Math.floor(Math.random() * 10);
                            const period = item.period || `2024${(1000 + index).toString()}`;
                            
                            return {
                                number,
                                period,
                                size: number >= 5 ? 'big' : 'small',
                                parity: number % 2 === 0 ? 'even' : 'odd',
                                color: number <= 1 || [3,7,9].includes(number) ? 'red' : 
                                       number === 5 ? 'violet' : 'green',
                                time: new Date(item.time || Date.now()).toLocaleString()
                            };
                        });
                        
                        // 更新统计
                        const bigCount = processedData.filter(item => item.size === 'big').length;
                        const oddCount = processedData.filter(item => item.parity === 'odd').length;
                        
                        document.getElementById('bigPercent').textContent = `${(bigCount/processedData.length*100).toFixed(1)}%`;
                        document.getElementById('smallPercent').textContent = `${((processedData.length-bigCount)/processedData.length*100).toFixed(1)}%`;
                        document.getElementById('oddPercent').textContent = `${(oddCount/processedData.length*100).toFixed(1)}%`;
                        document.getElementById('evenPercent').textContent = `${((processedData.length-oddCount)/processedData.length*100).toFixed(1)}%`;
                        
                        // 更新热门号码
                        const frequency = {};
                        processedData.forEach(item => frequency[item.number] = (frequency[item.number] || 0) + 1);
                        const hotNumbers = Object.entries(frequency).sort(([,a], [,b]) => b - a).slice(0, 5);
                        
                        document.getElementById('hotNumbersList').innerHTML = hotNumbers.map(([num, count]) => 
                            `<div class="hot-number-item">${num} (${count}次)</div>`
                        ).join('');
                        
                        // 更新历史记录
                        document.getElementById('recentHistoryList').innerHTML = processedData.map(item => 
                            `<div class="history-item">期号: ${item.period} | 号码: ${item.number} | ${item.size}/${item.parity}/${item.color}</div>`
                        ).join('');
                        
                        debug.log('数据处理完成，页面更新成功', 'success');
                    }
                } else {
                    throw new Error(`API请求失败: ${response.status}`);
                }
                
            } catch (error) {
                debug.log(`API测试失败: ${error.message}`, 'error');
                debug.log('使用模拟数据...', 'info');
                
                // 生成模拟数据
                const mockData = Array.from({length: 10}, (_, i) => {
                    const number = Math.floor(Math.random() * 10);
                    return {
                        number,
                        period: `2024${(1000 + i).toString()}`,
                        size: number >= 5 ? 'big' : 'small',
                        parity: number % 2 === 0 ? 'even' : 'odd',
                        color: number <= 1 || [3,7,9].includes(number) ? 'red' : 
                               number === 5 ? 'violet' : 'green',
                        time: new Date(Date.now() - i * 180000).toLocaleString()
                    };
                });
                
                // 使用模拟数据更新页面（与上面相同的逻辑）
                const bigCount = mockData.filter(item => item.size === 'big').length;
                const oddCount = mockData.filter(item => item.parity === 'odd').length;
                
                document.getElementById('bigPercent').textContent = `${(bigCount/mockData.length*100).toFixed(1)}%`;
                document.getElementById('smallPercent').textContent = `${((mockData.length-bigCount)/mockData.length*100).toFixed(1)}%`;
                document.getElementById('oddPercent').textContent = `${(oddCount/mockData.length*100).toFixed(1)}%`;
                document.getElementById('evenPercent').textContent = `${((mockData.length-oddCount)/mockData.length*100).toFixed(1)}%`;
                
                document.getElementById('hotNumbersList').innerHTML = '📝 使用模拟数据';
                document.getElementById('recentHistoryList').innerHTML = mockData.map(item => 
                    `<div class="history-item">期号: ${item.period} | 号码: ${item.number} | ${item.size}/${item.parity}/${item.color}</div>`
                ).join('');
                
                debug.log('模拟数据加载完成', 'success');
            }
            
            // 隐藏加载屏幕
            setTimeout(() => {
                debug.hideLoader();
                debug.log('应用初始化完成！', 'success');
            }, 1000);
        });
    </script>
</body>
</html>
